<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Relay UI starter and component showcase" />
    <meta name="theme-color" content="#12131a" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Relay UI Starter</title>
    <script>
      ;(function () {
        try {
          var theme = localStorage.getItem("theme")
          if (theme !== "light" && theme !== "dark") theme = "dark"
          var root = document.documentElement
          root.classList.remove("light", "dark")
          root.classList.add(theme)
          root.style.colorScheme = theme
          var colorMeta = document.querySelector('meta[name="theme-color"]')
          if (colorMeta)
            colorMeta.setAttribute("content", theme === "light" ? "#f4f6fa" : "#12131a")
        } catch (e) {
          document.documentElement.classList.add("dark")
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
